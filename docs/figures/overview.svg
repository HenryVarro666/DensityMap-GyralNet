<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc"><title id="title">DENSITYMAP-GYRALNET</title><desc id="desc">Cortical folding, as a network. Extract the gyral net and its 3-hinge gyri from cortical surfaces.</desc><defs><linearGradient id="paper" x2="1" y2="1"><stop stop-color="#F7F9FC"/><stop offset="1" stop-color="#EFF3F7"/></linearGradient></defs><rect width="1600" height="960" fill="url(#paper)"/><g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<rect x="0" y="0" width="1600" height="9" rx="0" fill="#3157A4" stroke="none"/>
<text x="64" y="66" font-size="20" fill="#172837" font-weight="700" letter-spacing="2" data-maxx="900">DENSITYMAP-GYRALNET</text>
<text x="1536" y="66" font-size="16" fill="#3157A4" font-weight="600" letter-spacing="1" text-anchor="end">CORTICAL FOLDING / BRAIN IMAGING</text>
<text x="60" y="167" font-size="72" fill="#142638" font-weight="500" data-maxx="1540">Cortical folding, as a network.</text>
<text x="64" y="221" font-size="27" fill="#344C5F" font-weight="400" data-maxx="1536">Extract the gyral net and its 3-hinge gyri from cortical surfaces.</text>
<text x="64" y="262" font-size="20" fill="#697988" font-weight="400" data-maxx="1536">VTK surfaces and sulcal depth in; gyral skeletons, 3-hinge vertices and graphs out.</text>
<rect x="64" y="323" width="344" height="272" rx="20" fill="#FFFFFF" stroke="#DCE4EB"/>
<rect x="88" y="349" width="44" height="5" rx="2" fill="#3157A4" stroke="none"/>
<text x="88" y="393" font-size="17" fill="#3157A4" font-weight="700" letter-spacing="1.4" data-maxx="394">01 / READ</text>
<text x="88" y="441" font-size="28" fill="#172C3C" font-weight="600" data-maxx="394">Surface + depth</text>
<text x="88" y="485" font-size="18" fill="#5C6D7B" font-weight="400" data-maxx="394">VTK surface meshes</text>
<text x="88" y="517" font-size="18" fill="#5C6D7B" font-weight="400" data-maxx="394">Sulcal depth per vertex</text>
<text x="88" y="549" font-size="18" fill="#5C6D7B" font-weight="400" data-maxx="394">HCP surfaces, 164k or 32k</text>
<path d="M416 458h16m-6-6 6 6-6 6" fill="none" stroke="#3157A4" stroke-width="2"/>
<rect x="440" y="323" width="344" height="272" rx="20" fill="#FFFFFF" stroke="#DCE4EB"/>
<rect x="464" y="349" width="44" height="5" rx="2" fill="#3157A4" stroke="none"/>
<text x="464" y="393" font-size="17" fill="#3157A4" font-weight="700" letter-spacing="1.4" data-maxx="770">02 / ISOLATE</text>
<text x="464" y="441" font-size="28" fill="#172C3C" font-weight="600" data-maxx="770">Gyral regions</text>
<text x="464" y="485" font-size="18" fill="#5C6D7B" font-weight="400" data-maxx="770">Split by sulcal depth</text>
<text x="464" y="517" font-size="18" fill="#5C6D7B" font-weight="400" data-maxx="770">Drop isolated vertices</text>
<text x="464" y="549" font-size="18" fill="#5C6D7B" font-weight="400" data-maxx="770">Find marginal points</text>
<path d="M792 458h16m-6-6 6 6-6 6" fill="none" stroke="#3157A4" stroke-width="2"/>
<rect x="816" y="323" width="344" height="272" rx="20" fill="#FFFFFF" stroke="#DCE4EB"/>
<rect x="840" y="349" width="44" height="5" rx="2" fill="#3157A4" stroke="none"/>
<text x="840" y="393" font-size="17" fill="#3157A4" font-weight="700" letter-spacing="1.4" data-maxx="1146">03 / SKELETONIZE</text>
<text x="840" y="441" font-size="28" fill="#172C3C" font-weight="600" data-maxx="1146">Gyral crests</text>
<text x="840" y="485" font-size="18" fill="#5C6D7B" font-weight="400" data-maxx="1146">Thin, then grow a tree</text>
<text x="840" y="517" font-size="18" fill="#5C6D7B" font-weight="400" data-maxx="1146">Dijkstra repairs gaps</text>
<text x="840" y="549" font-size="18" fill="#5C6D7B" font-weight="400" data-maxx="1146">Trim short branches</text>
<path d="M1168 458h16m-6-6 6 6-6 6" fill="none" stroke="#3157A4" stroke-width="2"/>
<rect x="1192" y="323" width="344" height="272" rx="20" fill="#FFFFFF" stroke="#DCE4EB"/>
<rect x="1216" y="349" width="44" height="5" rx="2" fill="#3157A4" stroke="none"/>
<text x="1216" y="393" font-size="17" fill="#3157A4" font-weight="700" letter-spacing="1.4" data-maxx="1522">04 / MARK</text>
<text x="1216" y="441" font-size="28" fill="#172C3C" font-weight="600" data-maxx="1522">3-hinge gyri</text>
<text x="1216" y="485" font-size="18" fill="#5C6D7B" font-weight="400" data-maxx="1522">Three-way crest junctions</text>
<text x="1216" y="517" font-size="18" fill="#5C6D7B" font-weight="400" data-maxx="1522">Written back to VTK</text>
<text x="1216" y="549" font-size="18" fill="#5C6D7B" font-weight="400" data-maxx="1522">Sphere and surface views</text>
<rect x="64" y="635" width="470" height="211" rx="18" fill="#E0E8F6" stroke="none"/>
<text x="88" y="675" font-size="15" fill="#3157A4" font-weight="700" letter-spacing="1.2" data-maxx="516">WHY IT MATTERS</text>
<text x="88" y="722" font-size="24" fill="#193346" font-weight="600" data-maxx="516">3-hinge gyri are cortical hubs</text>
<text x="88" y="765" font-size="18" fill="#536777" font-weight="400" data-maxx="516">Finer than brain regions and found</text>
<text x="88" y="795" font-size="18" fill="#536777" font-weight="400" data-maxx="516">in every brain: nodes of the gyral net.</text>
<rect x="565" y="635" width="470" height="211" rx="18" fill="#E8EDF3" stroke="none"/>
<text x="589" y="675" font-size="15" fill="#3157A4" font-weight="700" letter-spacing="1.2" data-maxx="1017">SCALE</text>
<text x="589" y="722" font-size="24" fill="#193346" font-weight="600" data-maxx="1017">Built for batch runs</text>
<text x="589" y="765" font-size="18" fill="#536777" font-weight="400" data-maxx="1017">One run per subject, GNU parallel</text>
<text x="589" y="795" font-size="18" fill="#536777" font-weight="400" data-maxx="1017">submission scripts.</text>
<rect x="1066" y="635" width="470" height="211" rx="18" fill="#E8EDF3" stroke="none"/>
<text x="1090" y="675" font-size="15" fill="#3157A4" font-weight="700" letter-spacing="1.2" data-maxx="1518">RELATED PAPERS</text>
<text x="1090" y="722" font-size="24" fill="#193346" font-weight="600" data-maxx="1518">GS-Net and Deep-GyralNet</text>
<text x="1090" y="765" font-size="18" fill="#536777" font-weight="400" data-maxx="1518">IEEE ISBI 2026, plus 3-hinge matching</text>
<text x="1090" y="795" font-size="18" fill="#536777" font-weight="400" data-maxx="1518">at ISBI 2024; see ccao2679.com.</text>
<path d="M64 888h1472" stroke="#CED9E3"/>
<text x="64" y="923" font-size="17" fill="#647788" font-weight="400" data-maxx="1536">RESEARCH CODE  /  vtk · nibabel · networkx. Methods are in the papers on the publications page.</text>
</g></svg>
